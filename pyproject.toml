[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fncre"
version = "0.1.0"
description = "Reusable reverse-engineering infrastructure for Fight Night Champion (Xbox 360)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fncre contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
fncre = "fncre.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fncre"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["fncre"]
mypy_path = "src"
ignore_missing_imports = true
