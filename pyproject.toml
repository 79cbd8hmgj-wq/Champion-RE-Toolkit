[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fncre"
version = "0.1.0"
description = "Reusable reverse-engineering infrastructure for Fight Night Champion (Xbox 360)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fncre contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = []

[project.optional-dependencies]
demangle = [
    "undname>=0.2",
]
xex = [
    "cryptography>=41",
]
dev = [
    "pytest>=7.4",
    # Pinned exactly (not >=): CI installs a fresh "ruff check ."/"mypy" on
    # every run, and these two tools change lint behavior across releases
    # (new default rules, stricter checks) often enough that a loose bound
    # lets local and CI disagree about whether the same code passes. Bump
    # deliberately, verifying `ruff check .`/`mypy` output doesn't change
    # unexpectedly, rather than letting `pip install` silently drift.
    "ruff==0.16.8",
    "mypy==2.3.1",
    "undname>=0.2",
    "cryptography>=41",
]

[project.scripts]
fncre = "fncre.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fncre"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["fncre"]
mypy_path = "src"
ignore_missing_imports = true
