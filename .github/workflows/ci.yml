name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -v

      - name: Guard against committed game artifacts
        run: |
          if git ls-files | grep -Ei '\.(xex|pdb|xdb|big|ast)$'; then
            echo "::error::Proprietary game artifact file extension found in git tree."
            exit 1
          fi
          if git ls-files | grep -E '\.map$'; then
            echo "::error::A raw .map file is committed. Only *.map.txt synthetic fixtures are allowed."
            exit 1
          fi
